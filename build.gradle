plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = "${mod_version}-neoforge-${minecraft_version}-port"
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    mavenCentral()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup 'com.geckolib' }
    }
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    // Jars that are not on Maven Central (sherpa-onnx), in Maven layout, no POMs.
    maven {
        url = uri('libs')
        metadataSources { artifact() }
        content { includeGroup 'com.k2fsa.sherpa.onnx' }
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            // Dev conveniences: gradlew runClient -PjoinServer=127.0.0.1:25599 -PplayerName=Friend
            if (project.hasProperty('joinServer')) {
                programArguments.addAll '--quickPlayMultiplayer', project.property('joinServer').toString()
            }
            if (project.hasProperty('playerName')) {
                programArguments.addAll '--username', project.property('playerName').toString()
            }
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            gameDirectory = project.file('run')
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Third-party libraries from Verity 6.0.0-beta.9's META-INF/jarjar that the trimmed build still
// uses, at the exact versions from its metadata.json.
ext.bundledLibs = [
        'dev.langchain4j:langchain4j:1.18.0',
        'dev.langchain4j:langchain4j-core:1.18.1',
        'dev.langchain4j:langchain4j-http-client:1.18.0',
        'dev.langchain4j:langchain4j-http-client-jdk:1.18.0',
        'dev.langchain4j:langchain4j-open-ai:1.18.0',
        'dev.langchain4j:langchain4j-ollama:1.18.0',
        'com.fasterxml.jackson.core:jackson-annotations:2.22',
        'com.fasterxml.jackson.core:jackson-core:2.22.1',
        'com.fasterxml.jackson.core:jackson-databind:2.22.1',
        'com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.22.1',
        'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.22.1',
        'com.knuddels:jtokkit:1.1.0',
        'org.apache.opennlp:opennlp-tools:2.5.9',
        'org.jspecify:jspecify:1.0.0',
        // Not on Maven Central, served from libs/: sherpa-onnx 1.13.3 (GitHub release jars),
        // copied unmodified from the original jar.
        'com.k2fsa.sherpa.onnx:sherpa-onnx:1.13.3',
        'com.k2fsa.sherpa.onnx:sherpa-onnx-native-lib-win-x64:1.13.3',
        'com.k2fsa.sherpa.onnx:sherpa-onnx-native-lib-linux-x64:1.13.3',
        'com.k2fsa.sherpa.onnx:sherpa-onnx-native-lib-osx-x64:1.13.3',
]

dependencies {
    implementation "com.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    implementation "maven.modrinth:yacl:${yacl_version}"

    bundledLibs.each { coords ->
        def (g, a, v) = coords.split(':')
        implementation(coords) { transitive = false }
        // Same jar-in-jar metadata as the original: version range [v,), pinned to v.
        jarJar("${g}:${a}") {
            transitive = false
            version {
                strictly "[${v},)"
                prefer v
            }
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '2000'
}
